[package]
name = "nannou_sketch"
version = "0.1.0"
edition = "2021"

[dependencies]
nannou = "0.19"
nokhwa = { version = "0.10", features = ["input-native", "output-threaded", "decoding"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
